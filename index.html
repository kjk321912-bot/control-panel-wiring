<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>제어판 배선 시뮬레이터</title>
<meta name="description" content="전기기능사 실기 공개문제 1~18번 제어판 배선 연습">
<meta name="theme-color" content="#1d2221">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="제어판 배선">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 도구줄 / 가운데 제어함(합판 400×420)과 외부 기구 · 떠 있는 도면 창 · 우측 정보 패널 (태블릿 가로 기준) */
:root{
  --bg:#e4e8e4; --panel:#f5f7f4; --raise:#ffffff; --line:#c6ccc6; --fg:#1b2220; --muted:#5b6661;
  --accent:#1f5aa6; --accent-fg:#ffffff; --accent-soft:rgba(31,90,166,.12);
  --danger:#c22d26; --ok:#2c7a47; --warn:#a86400; --live:#ffab1a;
  --stage:#cdd3cd; --wall:#c3cac4; --board:#dcc49a; --board-edge:#a98a57; --board-grid:rgba(110,80,30,.14); --board-grid5:rgba(110,80,30,.26); --board-ink:#3d301b;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151918; --panel:#1d2221; --raise:#252b2a; --line:#343c3a; --fg:#e2e8e5; --muted:#98a39e;
  --accent:#78a6ea; --accent-fg:#0b1628; --accent-soft:rgba(120,166,234,.16);
  --danger:#ff6b60; --ok:#62c487; --warn:#f0a640; --live:#ffb733;
  --stage:#101312; --wall:#181c1b; --board:#c4ab80; --board-edge:#8a6e42; --board-grid:rgba(70,50,20,.2); --board-grid5:rgba(70,50,20,.32); --board-ink:#2e2412;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151918; --panel:#1d2221; --raise:#252b2a; --line:#343c3a; --fg:#e2e8e5; --muted:#98a39e;
  --accent:#78a6ea; --accent-fg:#0b1628; --accent-soft:rgba(120,166,234,.16);
  --danger:#ff6b60; --ok:#62c487; --warn:#f0a640; --live:#ffb733;
  --stage:#101312; --wall:#181c1b; --board:#c4ab80; --board-edge:#8a6e42; --board-grid:rgba(70,50,20,.2); --board-grid5:rgba(70,50,20,.32); --board-ink:#2e2412;
  color-scheme:dark;}

html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
input,textarea{-webkit-user-select:text;user-select:text}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 312px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage side"}
#app.noside{grid-template-columns:minmax(0,1fr) 0}
#app.noside #side{display:none}

.top{grid-area:top;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:8px 16px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.prob{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--raise);padding:0 10px;font-weight:600;font-size:15px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:38px;padding:0 14px;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.chip{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0;display:grid;place-items:center;font-size:10px;font-weight:700}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.spacer{flex:1}
.btn{min-height:38px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 9px;font-size:12.5px}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:18px;height:18px}
.power{min-width:112px;font-weight:700}
.power.on{background:var(--danger);border-color:var(--danger);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.dot.show{display:inline-block}

#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--stage)}
#board{width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:min(520px,calc(100% - 210px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted);pointer-events:none}
.hint b{color:var(--fg)}
.zoom{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.zoom .btn{min-width:42px;min-height:42px;padding:0 10px}
.fault{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--danger);color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6}
.fault p{margin:0;flex:1;font-weight:500}
.fault .btn{background:#fff;color:#8f1c16;border:0}

/* 도면 창 */
.doc{position:absolute;right:12px;top:12px;width:min(640px,58%);height:min(400px,52%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;flex-direction:column;z-index:5;overflow:hidden}
.doc.big{left:12px!important;top:12px!important;right:12px;bottom:12px;width:auto;height:auto}
.doc.min{height:auto}
.doc.min .doc-b{display:none}
.doc-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);cursor:move;touch-action:none;flex-wrap:wrap}
.doc-h .seg button{min-height:32px;padding:0 10px;font-size:12.5px}
.doc-b{flex:1;overflow:auto;background:#fff;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.doc-b img{display:block;width:100%;height:auto;max-width:none}
.doc-ops{padding:12px 16px 20px;color:#1b2220;font-size:14px;line-height:1.6;max-width:70ch;-webkit-user-select:text;user-select:text}
.doc-ops p{margin:0 0 6px}
.doc-ops .h{font-weight:700;margin-top:12px}
.doc-ops .i{padding-left:1.6em;text-indent:-1.6em}
.doc-ops .note{color:#5b6661;font-size:12.5px;margin-top:12px}

#side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 32px;-webkit-user-select:text;user-select:text}
#side h2{margin:2px 0 0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
#side h3{margin:18px 0 8px;font-size:13px;font-weight:600}
.eyebrow{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:12px;color:var(--muted)}
.fld input,.fld select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:0 10px;font-size:15px;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
table.kv{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.kv td,table.kv th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.kv th{font-weight:600;color:var(--muted);font-size:11px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bad{color:var(--danger);font-weight:600}
.good{color:var(--ok);font-weight:600}
.card{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.pill.off{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.red{background:rgba(220,50,40,.14);color:var(--danger)}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600;font-size:13px;min-height:32px;display:flex;align-items:center}
ul.list{margin:6px 0 0;padding-left:18px;font-size:12.5px}
ul.list li{margin:3px 0}
.wsw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.modal{position:fixed;inset:0;background:rgba(10,14,13,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px 18px 20px;-webkit-user-select:text;user-select:text}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet h4{margin:18px 0 6px;font-size:13px}
.sheet textarea{width:100%;box-sizing:border-box;min-height:84px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:8px;font:12px var(--f-mono);resize:vertical}
.sheet input,.sheet select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:0 10px}
.sheet .row input{flex:2;min-width:0}
.slots{list-style:none;margin:8px 0 0;padding:0}
.slots li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.slots li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmtab select{min-height:36px;width:100%}
.pmtab td{padding:4px 3px}
.close{float:right}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.pitem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border-radius:9px;border:1px solid var(--line);background:var(--raise);font-size:11.5px;font-weight:500;line-height:1.2;text-align:center}
.pitem svg{width:100%;height:46px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;transition:.2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn);color:#fff}

/* svg */
.wallrect{fill:var(--wall)}
.panelrect{fill:var(--board);stroke:var(--board-edge);stroke-width:4}
.gridl{stroke:var(--board-grid);stroke-width:1;fill:none}
.gridl5{stroke:var(--board-grid5);stroke-width:1;fill:none}
.boardcap{font:600 15px var(--f-ui);fill:var(--muted)}
.zonecap{font:600 13px var(--f-ui);fill:var(--muted)}
svg text{pointer-events:none}
.tl{font:600 12.5px var(--f-ui);fill:#1c2124}
.tlw{font:600 12.5px var(--f-ui);fill:#fff}
.tld{font:600 10.5px var(--f-ui);fill:#1c2124}
.ts{font:500 8.5px var(--f-mono);fill:#596065}
.tsw{font:500 9px var(--f-mono);fill:#dfe3e5;text-anchor:middle}
.tsl{font:500 8.5px var(--f-mono);fill:#e2e6e8}
.tn{font:600 9px var(--f-mono);fill:#e8ebed;text-anchor:middle}
.tnb{font:600 10px var(--f-mono);fill:#e8ebed;text-anchor:middle}
.tnd{font:600 9.5px var(--f-mono);fill:#363b3f;text-anchor:middle}
.tc{font:700 13px var(--f-ui);fill:var(--board-ink);text-anchor:middle}
.tcx{font:700 13px var(--f-ui);fill:var(--fg);text-anchor:middle}
.tstat{font:700 11px var(--f-ui);text-anchor:middle}
.selbox{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 4}
.pin .ph{fill:transparent}
.pin .ps{fill:#d6d9db;stroke:#6b7276;stroke-width:1.1}
.pin .pslot{stroke:#6b7276;stroke-width:1.4}
.mode-wire .pin .ps{stroke:#2b5fa8;stroke-width:1.6}
.pin.hov .ph,.pin.pend .ph{fill:var(--accent);opacity:.35}
.pin.pend .ps{fill:#ffd23f}
.pin.over .ph{fill:#e0281e;opacity:.4}
.wire .wh{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.wire .wo{fill:none;stroke:rgba(0,0,0,.45);stroke-width:5.2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.wire .wc{fill:none;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.wire.sel .wo{stroke:var(--accent);stroke-width:9;opacity:.75}
.sim .wire.live .wo{stroke:var(--live);stroke-width:8;opacity:.7}
.wire.short .wo{stroke:#ff2416;stroke-width:10;opacity:.9;animation:blink .5s steps(2) infinite}
.handle circle{fill:var(--accent);stroke:#fff;stroke-width:2}
.rubber{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;fill:none;pointer-events:none}
.rot{transform-box:fill-box;transform-origin:center}
.rot.cw{animation:spin .5s linear infinite}
.rot.ccw{animation:spin .5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.rot.cw,.rot.ccw{animation-duration:3s}.wire.short .wo{animation:none}.toast{transition:none}}

@media (max-width: 900px){
  #app,#app.noside{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top" "stage"}
  #side,#app.noside #side{display:block;position:fixed;left:0;right:0;bottom:0;max-height:58%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.2);z-index:10;transform:translateY(105%);transition:transform .2s;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
  #app.sideopen #side{transform:none}
  .doc{width:calc(100% - 24px);height:42%}
  .hint{display:none}
  .brand small{display:none}
}
</style>
</head>
<body>

<div id="app" class="mode-place">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="6" fill="#2a2d30"/><circle cx="9" cy="9" r="3" fill="#d6d9db"/><circle cx="21" cy="21" r="3" fill="#d6d9db"/><path d="M9 9V15H21V21" stroke="#e8c21c" stroke-width="2.4" fill="none"/></svg>
      <div><b>제어판 배선</b><small>전기기능사 공개문제</small></div>
    </div>
    <select class="prob" id="prob" aria-label="공개문제 선택"></select>
    <div class="seg" id="modes">
      <button data-mode="place" class="on">배치</button>
      <button data-mode="wire">배선</button>
      <button data-mode="sim">동작 시험</button>
    </div>
    <div class="chips" id="wirebar" hidden></div>
    <div class="chips" id="simbar" hidden>
      <button class="btn power" id="btn-power">전원 OFF</button>
      <button class="btn" id="btn-reset">초기화</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btn-undo" title="되돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>되돌리기</button>
    <button class="btn" id="btn-redo" title="다시 실행"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="btn" id="btn-doc">도면</button>
    <button class="btn" id="btn-file">파일</button>
    <button class="btn" id="btn-side">정보 <span class="dot" id="seldot"></span></button>
  </header>

  <main id="stage">
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="g25" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" class="gridl"/></pattern>
        <pattern id="g125" width="125" height="125" patternUnits="userSpaceOnUse"><path d="M125 0H0V125" class="gridl5"/></pattern>
      </defs>
      <g id="vp">
        <rect class="wallrect" x="-560" y="-330" width="2120" height="1760" rx="24"/>
        <text x="-540" y="-300" class="zonecap">외부 기구 (컨트롤 박스 · 단자대)</text>
        <text x="0" y="-14" class="boardcap">제어함 400 × 420 mm</text>
        <rect class="panelrect" x="0" y="0" width="1000" height="1050" rx="4"/>
        <rect x="0" y="0" width="1000" height="1050" fill="url(#g25)"/>
        <rect x="0" y="0" width="1000" height="1050" fill="url(#g125)"/>
        <g id="Lparts"></g><g id="Lwires"></g><g id="Lpins"></g><g id="Lover"></g>
      </g>
    </svg>
    <section class="doc" id="doc">
      <div class="doc-h" id="doc-h">
        <div class="seg" id="doc-tabs">
          <button data-tab="c" class="on">회로도</button><button data-tab="o">동작 사항</button><button data-tab="p">핀 결선도</button><button data-tab="b">배관도</button>
        </div>
        <div class="spacer"></div>
        <button class="btn sm" id="doc-zo" aria-label="도면 축소">−</button>
        <button class="btn sm" id="doc-zi" aria-label="도면 확대">+</button>
        <button class="btn sm" id="doc-big">크게</button>
        <button class="btn sm" id="doc-min">접기</button>
      </div>
      <div class="doc-b" id="doc-b"></div>
    </section>
    <div class="fault" id="fault" hidden><p id="fault-msg"></p><button class="btn" id="fault-ok">확인</button></div>
    <div class="hint" id="hint"></div>
    <div class="zoom">
      <button class="btn" id="z-out" aria-label="축소">−</button>
      <button class="btn" id="z-in" aria-label="확대">+</button>
      <button class="btn" id="z-fit">맞춤</button>
    </div>
  </main>

  <aside id="side"><div id="side-body"></div></aside>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

function buildProblem(n){

  const tw=DEFS.tb20.w;
  add('tb20','TB5',snapv(500-tw/2),85);add('tb20','TB6',snapv(500-tw/2),885);
  LAYOUT[n].forEach((row,ri)=>{
    const labs=row.split(' '),ds=labs.map(l=>DEFS[typeOf(l)]),sum=ds.reduce((a,d)=>a+d.w,0),gap=(860-sum)/(labs.length-1),cy=ri?687:362;
    let x=70;labs.forEach((l,i)=>{add(ds[i].type,l,snapv(x),snapv(cy-ds[i].h/2));x+=ds[i].w+gap;});
  });
  const A=n<=9;
  add('tbp','TB1',430,-250);

}

    case 'wire':{const A=pinPos(gest.from);$('#rubber').setAttribute('d',`M${A.x} ${A.y}L${bp.x} ${bp.y}`);

function fitRect(x0,y0,x1,y1){
  const r=svg.getBoundingClientRect();if(!r.width)return;const pad=24;
  const s=clamp(Math.min((r.width-pad*2)/(x1-x0),(r.height-pad*2)/(y1-y0)),.2,2);
  view.s=s;view.tx=(r.width-(x1-x0)*s)/2-x0*s;view.ty=(r.height-(y1-y0)*s)/2-y0*s;applyView();
}
function fit(){
  let x0=0,y0=-30,x1=1000,y1=1050;
  for(const p of S.parts){const d=DEFS[p.type];x0=Math.min(x0,p.x);y0=Math.min(y0,p.y-20);x1=Math.max(x1,p.x+d.w);y1=Math.max(y1,p.y+d.h+24);}
  fitRect(x0,y0,x1,y1);
}
let fitPanelNext=false;
$('#z-in').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,view.s*1.25);};
$('#z-out').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,view.s/1.25);};
$('#z-fit').onclick=()=>{fitPanelNext=!fitPanelNext;fitPanelNext?fitRect(-10,-30,1010,1060):fit();$('#z-fit').textContent=fitPanelNext?'전체':'맞춤';};

/* ---------- 결선 목록 · 정답 비교 ---------- */
const nat=(a,b)=>a.localeCompare(b,'ko',{numeric:true});
function wireNets(){
  const uf=makeUF(),keys=new Set();
  for(const w of S.wires){const a=pinName(w.a),b=pinName(w.b);uf.union(a,b);keys.add(a);keys.add(b);}
  const g=new Map();for(const k of keys){const r=uf.find(k);if(!g.has(r))g.set(r,[]);g.get(r).push(k);}
  return [...g.values()].map(a=>a.sort(nat)).sort((a,b)=>nat(a[0],b[0]));
}
/* 정답 비교용: TB5·TB6 단자대는 몇 번 단자를 썼는지 상관없이 통과시켜 기구 단자끼리의 연결만 비교 */
function elecNets(){
  const uf=makeUF(),keys=new Set(),tb=new Set(S.parts.filter(p=>p.type==='tb20').map(p=>p.id));
  for(const w of S.wires){const a=K(w.a.p,w.a.k),b=K(w.b.p,w.b.k);uf.union(a,b);keys.add(a);keys.add(b);}
  for(const p of S.parts)if(tb.has(p.id))for(let i=1;i<=20;i++)uf.union(K(p.id,''+i),K(p.id,i+"'"));
  const g=new Map();
  for(const k of keys){const [pid,pin]=k.split('\u0001');if(tb.has(pid))continue;const r=uf.find(k);if(!g.has(r))g.set(r,[]);g.get(r).push(`${partById(pid).label}:${pin}`);}
  return [...g.values()].filter(a=>a.length>1).map(a=>a.sort(nat)).sort((a,b)=>nat(a[0],b[0]));
}
function compare(ans,cur){
  const idx=nets=>{const m=new Map();nets.forEach((n,i)=>n.forEach(k=>m.set(k,i)));return m;};
  const ci=idx(cur),ai=idx(ans),miss=[],extra=[];
  const split=(net,m)=>{const g=new Map();for(const k of net){const i=m.has(k)?m.get(k):'solo:'+k;if(!g.has(i))g.set(i,k);}return [...g.values()];};
  for(const n of ans){const r=split(n,ci);for(let i=1;i<r.length;i++)miss.push([r[0],r[i]]);}
  for(const n of cur){const r=split(n,ai);for(let i=1;i<r.length;i++)extra.push([r[0],r[i]]);}
  return {miss,extra};
}
function dupLabels(){const s=new Set(),d=new Set();for(const p of S.parts){if(s.has(p.label))d.add(p.label);s.add(p.label);}return [...d];}

  h+=`<div class="card small muted">전압이 걸린 전선은 주황색으로 빛납니다. 코일과 램프는 서로 다른 두 상에 연결되어야 동작합니다. 상끼리 부하 없이 이어지면 단락으로 판정합니다. 플로트레스는 FLS 7·8·1번이 TB4의 E1·E2·E3에 연결되어 있어야 수위를 감지합니다.</div>`;
  return h;
}

function chipStyle(c){return `background:${c.stripe?`repeating-linear-gradient(45deg,${c.hex} 0 6px,${c.stripe} 6px 12px)`:c.hex};color:${['k','br'].includes(c.k)?'#fff':'#111'}`;}
function bindPanel(){
  const p=sel&&sel.t==='part'?partById(sel.id):null,w=sel&&sel.t==='wire'?wireById(sel.id):null;
  const lab=$('#inp-label');
  if(lab&&p){let pushed=false;lab.oninput=()=>{if(!pushed){pushUndo();pushed=true;}p.label=lab.value.trim()||p.label;save();renderParts();};lab.onchange=()=>renderPanel();}
  const st=$('#inp-set');if(st&&p)st.onchange=()=>{const v=parseFloat(st.value);if(v>0){pushUndo();p.set=v;afterChange();}};
  const on=(id,f)=>{const b=$(id);if(b)b.onclick=f;};
  on('#b-del',()=>delPart(p.id));on('#b-dup',()=>dupPart(p.id));on('#b-pm',()=>openPinmap(p.type));on('#b-pm2',()=>openPinmap());on('#b-add',openAdd);
  on('#b-relay',()=>{pushUndo();const b=buildProblem(prob);S.parts=b.parts;S.wires=[];S.nextId=b.nextId;sel=null;afterChange();fit();toast('배치를 처음대로 되돌리고 전선을 모두 지웠습니다. 되돌리기로 취소할 수 있습니다.');});
  on('#b-delw',()=>delWire(w.id));on('#b-auto',()=>{pushUndo();delete w.m;afterChange();});
  for(const b of document.querySelectorAll('[data-wc]'))b.onclick=()=>{pushUndo();w.c=b.dataset.wc;wireColor=w.c;buildWirebar();afterChange();};
  for(const b of document.querySelectorAll('[data-route]'))b.onclick=()=>{pushUndo();w.r=b.dataset.route;delete w.m;afterChange();};
  on('#b-setans',()=>{if(!S.wires.length){toast('전선이 없습니다');return;}answer=elecNets();store.set('cpw2.a'+prob,answer);cmp=null;renderPanel();toast(`${prob}번 정답으로 저장했습니다`);});
  on('#b-cmp',()=>{cmp=compare(answer,elecNets());renderPanel();});
}

document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select'))return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
  else if((e.key==='Delete'||e.key==='Backspace')&&sel&&mode!=='sim'){e.preventDefault();sel.t==='part'?delPart(sel.id):delWire(sel.id);}
  else if(e.key==='Escape'){pending=null;sel=null;$('#modal').hidden=true;renderAll();renderPanel();updateHint();}
  else if(e.key==='1')setMode('place');else if(e.key==='2')setMode('wire');else if(e.key==='3')setMode('sim');
});

function exportJson(){return JSON.stringify({app:'cpw2',prob,parts:S.parts,wires:S.wires,nextId:S.nextId,answer});}
function loadData(o){
  if(!o||!Array.isArray(o.parts)||!Array.isArray(o.wires))throw new Error('형식');
  if(o.prob&&o.prob!==prob){prob=o.prob;probSel.value=prob;store.set('cpw2.prob',prob);renderDoc();}
  pushUndo();S.parts=o.parts.filter(p=>DEFS[p.type]);S.wires=o.wires;S.nextId=o.nextId||(S.parts.length+S.wires.length+1);
  if(o.answer!==undefined){answer=o.answer;if(answer)store.set('cpw2.a'+prob,answer);}
  sel=null;pending=null;cmp=null;if(mode==='sim')setMode('place');afterChange();fit();
}
function openFile(){
  const slots=store.get('cpw2.slots',[]);
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const inst=standalone?'<p class="small good">앱으로 설치되어 실행 중입니다. 인터넷 없이도 쓸 수 있습니다.</p>'
    :installEvt?'<div class="row"><button class="btn primary" id="f-install">이 기기에 앱으로 설치</button></div>'
    :ios?'<p class="small">Safari 아래(또는 위)의 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>를 누르면 앱처럼 설치됩니다.</p>'
    :'<p class="small">Chrome이나 삼성 인터넷 메뉴(⋮)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.</p>';
  modal(`<h3>파일</h3><h4>앱으로 설치</h4>${inst}<p class="small muted">각 공개문제의 배선은 이 기기에 자동 저장됩니다.</p>
  <h4>이름 붙여 저장</h4><div class="row"><input id="f-name" placeholder="예: ${prob}번 1회차" maxlength="40"><button class="btn primary" id="f-save">저장</button></div>
  <ul class="slots">${slots.map((s,i)=>`<li><span>${esc(s.name)} <span class="muted small">${s.prob?s.prob+'번 · ':''}${new Date(s.t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></span><button class="btn" data-load="${i}">열기</button><button class="btn danger" data-del="${i}">삭제</button></li>`).join('')||'<li class="muted small">저장된 배선이 없습니다</li>'}</ul>
  <h4>다른 기기로 옮기기</h4><p class="small muted">아래 내용을 복사해서 다른 태블릿의 가져오기 칸에 붙여 넣으세요. 과제 번호와 정답도 함께 옮겨집니다.</p>
  <textarea id="f-json" readonly>${esc(exportJson())}</textarea><div class="row"><button class="btn" id="f-copy">복사</button></div>
  <textarea id="f-in" placeholder="복사한 배선 내용을 여기에 붙여 넣으세요"></textarea><div class="row"><button class="btn" id="f-import">가져오기</button></div>`);
  const fi=$('#f-install');if(fi)fi.onclick=async()=>{const ev=installEvt;installEvt=null;ev.prompt();const r=await ev.userChoice;closeModal();toast(r.outcome==='accepted'?'설치했습니다. 홈 화면에서 실행하세요.':'설치를 취소했습니다');};
  $('#f-save').onclick=()=>{const n=$('#f-name').value.trim()||(`${prob}번 `+(slots.length+1));const i=slots.findIndex(s=>s.name===n);const it={name:n,prob,t:Date.now(),data:{prob,parts:S.parts,wires:S.wires,nextId:S.nextId}};if(i>=0)slots[i]=it;else slots.unshift(it);store.set('cpw2.slots',slots);toast(`'${n}' 저장됨`);openFile();};
  for(const b of document.querySelectorAll('[data-load]'))b.onclick=()=>{const s=slots[+b.dataset.load];loadData(s.data);closeModal();toast(`'${s.name}' 열림`);};
  for(const b of document.querySelectorAll('[data-del]'))b.onclick=()=>{slots.splice(+b.dataset.del,1);store.set('cpw2.slots',slots);openFile();};
  $('#f-copy').onclick=()=>{const ta=$('#f-json');const done=()=>toast('복사했습니다');const fb=()=>{ta.focus();ta.select();toast('선택된 내용을 길게 눌러 복사하세요');};
    try{navigator.clipboard.writeText(ta.value).then(done,fb);}catch(_){fb();}};
  $('#f-import').onclick=()=>{try{loadData(JSON.parse($('#f-in').value));closeModal();toast('배선을 가져왔습니다');}catch(_){toast('내용을 읽지 못했습니다. 복사한 내용 전체를 붙여 넣었는지 확인하세요.','warn');}};
}
function openPinmap(type){
  const types=Object.values(DEFS).filter(d=>d.sock);let cur=type&&DEFS[type].sock?type:types[0].type;let rows;
  const kinds=Object.keys(KIND).filter(k=>!['lamp','buzzer','ls1','ls2'].includes(k));
  const load=()=>{rows=JSON.parse(JSON.stringify(elsOf(cur)));};
  const draw=()=>{
    const pins=DEFS[cur].pins.map(q=>q.k).sort((a,b)=>a-b),opt=(v,list,lab)=>list.map(x=>`<option value="${x}" ${x===v?'selected':''}>${lab?lab(x):x}</option>`).join('');
    modal(`<h3>기구 핀 설정</h3><p class="small muted">기본값은 공개문제 '5) 기구의 내부 결선도'를 따릅니다. 실습실 기구가 다르면 여기서 고치세요. 모든 과제에 적용됩니다.</p>
    <label class="fld"><span>기구</span><select id="pm-type">${types.map(d=>`<option value="${d.type}" ${d.type===cur?'selected':''}>${d.name}</option>`).join('')}</select></label>
    <table class="kv pmtab"><tr><th>요소</th><th>단자</th><th>단자</th><th></th></tr>${rows.map((r,i)=>`<tr><td><select data-i="${i}" data-f="0">${opt(r[0],kinds,k=>KIND[k])}</select></td><td><select data-i="${i}" data-f="1">${opt(r[1],pins)}</select></td><td><select data-i="${i}" data-f="2">${opt(r[2],pins)}</select></td><td><button class="btn danger" data-rm="${i}" aria-label="삭제">×</button></td></tr>`).join('')}</table>
    <div class="row"><button class="btn" id="pm-add">요소 추가</button><button class="btn" id="pm-reset">기본값으로</button><button class="btn primary" id="pm-save">저장</button></div>
    ${PINMAP[cur]?'<p class="small muted">이 기구는 기본값에서 바뀐 설정을 쓰고 있습니다.</p>':''}`);
    $('#pm-type').onchange=e=>{cur=e.target.value;load();draw();};
    for(const s of document.querySelectorAll('.pmtab select'))s.onchange=()=>{rows[+s.dataset.i][+s.dataset.f]=s.value;};
    for(const b of document.querySelectorAll('[data-rm]'))b.onclick=()=>{rows.splice(+b.dataset.rm,1);draw();};
    $('#pm-add').onclick=()=>{rows.push(['no',pins[0],pins[1]]);draw();};
    $('#pm-reset').onclick=()=>{delete PINMAP[cur];store.set('cpw2.pinmap',PINMAP);load();draw();renderAll();renderPanel();toast('기본값으로 되돌렸습니다');};
    $('#pm-save').onclick=()=>{PINMAP[cur]=rows;store.set('cpw2.pinmap',PINMAP);renderAll();renderPanel();closeModal();toast(`${DEFS[cur].name} 핀 설정을 저장했습니다`);};
  };
  load();draw();
}

/* ---------- 과제 불러오기 ---------- */
function loadProblem(n){
  if(mode==='sim')setMode('place');
  prob=n;probSel.value=n;store.set('cpw2.prob',n);
  const saved=store.get('cpw2.b'+n,null);
  if(saved&&Array.isArray(saved.parts)&&saved.parts.length){S.parts=saved.parts.filter(p=>DEFS[p.type]);S.wires=saved.wires||[];S.nextId=saved.nextId||1;}
  else{const b=buildProblem(n);S.parts=b.parts;S.wires=b.wires;S.nextId=b.nextId;}
  answer=store.get('cpw2.a'+n,null);cmp=null;sel=null;pending=null;undoS.length=0;redoS.length=0;
  renderAll();renderPanel();updateUndo();renderDoc();updateHint();requestAnimationFrame(fit);
}
/* ---------- PWA ---------- */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
addEventListener('appinstalled',()=>{installEvt=null;toast('앱이 설치되었습니다');});
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='activated'&&navigator.serviceWorker.controller)toast('새 버전이 준비되었습니다. 앱을 다시 열면 적용됩니다.');});});
  }).catch(()=>{});});
}
(function init(){
  if(innerWidth<1200&&innerWidth>900)$('#app').classList.add('noside');
  buildWirebar();setMode('place');loadProblem(prob);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>renderAll());
  addEventListener('resize',()=>{});
})();
</script>
